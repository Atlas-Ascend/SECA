schema: ghost-atlas.hypernet.node/v1
node_id: seca
repository: Atlas-Ascend/SECA
lifecycle: seed
plane: verification
canonical_role: audit-inspection-quality-control-and-finish-truth
authority:
  owns:
    - audit
    - inspection
    - quality-control
    - acceptance-gates
    - finish-truth
  does_not_own:
    - primary-implementation
    - executive-authorization
    - runtime-routing
inputs:
  - source-receipts
  - build-receipts
  - test-receipts
  - runtime-receipts
  - deployment-receipts
outputs:
  - PASS
  - FAIL
  - CONDITIONAL
upstream:
  - Ghost-Atlas-Runtime-Observatory
  - Ghost-Atlas-Release-Deployment-Control-Plane
  - Ghost-Atlas-Software-Factory-End-to-End-SDLC-Control-Plane
downstream:
  - promotion-gates
  - ProofGrid
failure_route:
  implementation: DEVOS
  build: Ghost-Atlas-Software-Factory-End-to-End-SDLC-Control-Plane
  security: Medusa-Sovereign-Security
